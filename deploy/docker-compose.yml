# 大富翁4 联机版部署示例（docs/architecture.md §9.3；原版皮肤见 docs/design/original-skin.md U4、design-draft §5.4）
#
#   cp deploy/.env.example deploy/.env      # 填好 SAVE_HMAC_SECRET、PUBLIC_URL、SITE_ADDRESS；
#                                           # 用原版皮肤时把 ACCESS_MODE 改为 passcode（或 invite）并填 ACCESS_*（示例默认 off）
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 数据：
#   rich4-state            读写卷：sqlite（房间、存档、门禁邀请码与授权）、每日备份
#   ../rich4-data          只读：npm run extract -- all && npm run extract -- pack 的产物（原版地图数据，不入库、不进镜像）
#   ../rich4-assets        只读、可选：npm run extract -- assets build 的原版皮肤素材包（仅供私人与朋友游玩）
#
# 原版皮肤素材包：
# - 镜像里**绝不** COPY 素材包（根目录 .dockerignore 排除 rich4-assets/、*.flc；deploy/Dockerfile 构建时再检查一遍）。
#   素材包只通过下面的只读挂载进入容器，由服务器 /pack/* 按 manifest 白名单提供。
# - 宿主目录 ../rich4-assets 不存在时 Docker 会建一个空目录：容器里没有 manifest.json，素材包不启用，前端用程序化美术。
# - 挂载目录里有 manifest.json 时服务器**必须**设置访问门禁（.env 里 ACCESS_MODE=passcode 或 invite，
#   再加 ACCESS_SECRET 与 ACCESS_PASSCODE_HASH），否则拒绝启动。
# - 宿主目录建议 0750，属组要让容器内的 node 用户（uid/gid 1000）可读：chgrp -R 1000 rich4-assets && chmod -R g+rX rich4-assets
# - 管理门禁：镜像里没有 scripts/access.ts，用 ADMIN_TOKEN（门禁开启时 ≥32 字节）调管理接口，例如
#   吊销全部会话：curl -X POST -H "Authorization: Bearer $ADMIN_TOKEN" https://<域名>/admin/access/revoke
#   生成邀请码：POST /admin/access/invites（JSON {"uses":5,"days":7}；ACCESS_MODE=invite 时必须配置 ADMIN_TOKEN）
name: rich4

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rich4:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      DATA_DIR: /data
      RICH4_DATA_DIR: /data-rich4
      # Caddy 与 app 同在 compose 网络（私有网段）：信任它的 X-Forwarded-For，门禁限流才能按真实 IP 计算
      TRUST_PROXY: '1'
      # 原版皮肤素材包（可选）：与下面的只读挂载对应；目录里没有 manifest.json 时不启用
      RICH4_ASSETS_DIR: /assets-rich4
    volumes:
      - rich4-state:/data
      - ../rich4-data:/data-rich4:ro
      # 可选：原版皮肤素材包，只读挂载（不用原版皮肤时可以删掉这一行）
      - ../rich4-assets:/assets-rich4:ro
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rich4-state:
  caddy-data:
  caddy-config:
